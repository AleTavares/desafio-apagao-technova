# Fase 3 CORRIGIDA — stack sobe saudavel e a API conecta ao PostgreSQL.
# Correcoes aplicadas (1 a 5):
#   1. API e Postgres agora na MESMA rede (technova-net)
#   2. Adicionada a env DB_PASSWORD no servico api
#   3. DB_HOST corrigido de "database" para "postgres" (nome real do servico)
#   4. Healthcheck corrigido de "pg_ready" para "pg_isready"
#   5. depends_on agora espera o banco ficar SAUDAVEL (condition: service_healthy)

services:
  api:
    build: ./app
    container_name: fase3-api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=technova
      - DB_USER=technova
      - DB_PASSWORD=technova
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - technova-net

  postgres:
    image: postgres:15-alpine
    container_name: fase3-db
    environment:
      - POSTGRES_DB=technova
      - POSTGRES_USER=technova
      - POSTGRES_PASSWORD=technova
    networks:
      - technova-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U technova"]
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  technova-net:
    driver: bridge